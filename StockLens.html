const TICKERS = Object.keys(ALL_DATA);
let currentTicker = null;
let currentTab = 'analyse';

function scoreColor(s) {
  return s >= 7 ? '#00e5a0' : s >= 5 ? '#f5c518' : '#ff4d6d';
}

function scoreBar(score) {
  const color = scoreColor(score);
  return `<div style="background:#1a1f2e;border-radius:4px;height:6px;width:100%;margin-top:8px;overflow:hidden">
    <div class="score-bar-inner" style="width:${(score/10)*100}%;height:100%;background:${color};border-radius:4px"></div>
  </div>`;
}

function renderChips() {
  return TICKERS.map(t => `
    <button class="chip" onclick="selectTicker('${t}')" style="background:${currentTicker===t?'#0f2a22':'#1a1f2e'};border-radius:20px;padding:5px 12px;font-size:12px;color:${currentTicker===t?'#00e5a0':'#6b7280'};font-weight:${currentTicker===t?'700':'400'}">${t}</button>
  `).join('');
}

function renderAnalyse(d, ticker) {
  const sc = scoreColor(d.score);
  return `
  <div class="fade-in">
    <div style="background:linear-gradient(135deg,#0f2a22,#111827);border:1px solid #1e4d38;border-radius:16px;padding:22px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1;padding-right:16px">
          <div style="font-size:21px;font-weight:800;letter-spacing:-0.5px">${d.name} <span style="color:#00e5a0;font-size:14px">${ticker}</span></div>
          <div style="color:#6b7280;font-size:12px;margin-top:3px">${d.sector}</div>
          <p style="color:#9ca3af;font-size:13px;line-height:1.7;margin-top:12px">${d.zusammenfassung}</p>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:62px;font-weight:800;line-height:1;color:${sc}">${d.score}</div>
          <div style="color:#6b7280;font-size:12px">/ 10</div>
          ${d.score>=7?`<div style="margin-top:8px;background:#0f2a22;border:1px solid #00e5a0;border-radius:20px;padding:3px 10px;font-size:10px;color:#00e5a0;font-weight:700">★ WATCHLIST</div>`:''}
        </div>
      </div>
    </div>

    ${[['bw','bw_t','📊 Bewertung'],['wa','wa_t','📈 Wachstum'],['gs','gs_t','💪 Finanzgesundheit'],['qu','qu_t','🔍 Qualität & Moat']].map(([key,tkey,label]) => `
      <div style="background:#111827;border:1px solid #1e2736;border-radius:12px;padding:16px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;color:#9ca3af">${label}</span>
          <span style="font-size:20px;font-weight:800;color:${scoreColor(d[key])}">${d[key]}<span style="font-size:11px;color:#6b7280;font-weight:400">/10</span></span>
        </div>
        ${scoreBar(d[key])}
        <p style="font-size:12px;color:#6b7280;line-height:1.7;margin-top:10px">${d[tkey]}</p>
      </div>
    `).join('')}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div style="background:#0a1f19;border:1px solid #1e4d38;border-radius:12px;padding:14px">
        <div style="color:#00e5a0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">✅ Stärken</div>
        ${d.staerken.map(s=>`<div style="display:flex;gap:6px;margin-bottom:8px;font-size:12px;color:#9ca3af;line-height:1.5"><span style="color:#00e5a0;flex-shrink:0">→</span>${s}</div>`).join('')}
      </div>
      <div style="background:#1f0a0a;border:1px solid #4d1f1f;border-radius:12px;padding:14px">
        <div style="color:#ff4d6d;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">⚠️ Risiken</div>
        ${d.risiken.map(r=>`<div style="display:flex;gap:6px;margin-bottom:8px;font-size:12px;color:#9ca3af;line-height:1.5"><span style="color:#ff4d6d;flex-shrink:0">→</span>${r}</div>`).join('')}
      </div>
    </div>

    <div style="background:#111827;border:1px solid #2d3748;border-radius:12px;padding:16px;margin-bottom:10px">
      <div style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">📋 Gesamtfazit</div>
      <p style="color:#9ca3af;line-height:1.8;font-size:13px">${d.fazit}</p>
    </div>
    <div style="font-size:10px;color:#374151;text-align:center;padding:4px 0 8px">⚠️ Keine Finanzberatung · Quellen: SEC Filings, StockAnalysis · Mai 2026</div>
  </div>`;
}

function renderKennzahlen(d) {
  const rows = [
    ['KGV (P/E)', d.pe ? d.pe+'x' : 'n/a (Verlust)', 'Kurs / Gewinn je Aktie'],
    ['KUV (P/S)', d.ps+'x', 'Kurs / Umsatz je Aktie'],
    ['Umsatzwachstum', '+'+d.rg+'% YoY', 'Wachstum gegenüber Vorjahr'],
    ['Bruttomarge', d.gm+'%', 'Umsatz minus direkte Kosten'],
    ['Operating Margin', d.om+'%', 'Betriebsgewinnmarge'],
    ['Debt / Equity', d.de+'x', 'Schulden / Eigenkapital'],
    ['Free Cash Flow', d.fcf+' Mrd. $', 'Tatsächlich verdientes Geld'],
  ];
  return `<div class="fade-in">
    ${rows.map(([label,wert,info])=>`
      <div style="background:#111827;border:1px solid #1e2736;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:13px;font-weight:600">${label}</div>
          <div style="font-size:11px;color:#6b7280;margin-top:3px">${info}</div>
        </div>
        <div style="font-size:15px;font-weight:700;color:#00e5a0">${wert}</div>
      </div>
    `).join('')}
    <div style="font-size:10px;color:#374151;text-align:center;padding:8px 0">⚠️ Daten: Mai 2026 · Keine Finanzberatung</div>
  </div>`;
}

function render() {
  const d = currentTicker ? ALL_DATA[currentTicker] : null;
  document.getElementById('app').innerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:26px;font-weight:800;letter-spacing:-1px;color:#00e5a0">STOCK<span style="color:#e6edf3">LENS</span> <span style="font-size:11px;font-weight:400;color:#6b7280;letter-spacing:0">15 Unternehmen · Mai 2026</span></div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="searchInput" type="text" placeholder="Ticker: NVDA, META, PLTR..." value="${currentTicker||''}"
        style="flex:1;background:#111827;border:1px solid #1e2736;border-radius:10px;padding:12px 16px;color:#e6edf3;font-size:15px"
        oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" style="background:#00e5a0;border:none;border-radius:10px;padding:12px 18px;color:#0d1117;font-weight:700;font-size:16px;cursor:pointer">🔍</button>
    </div>

    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">${renderChips()}</div>

    ${d ? `
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="tab-btn" onclick="setTab('analyse')" style="flex:1;padding:10px;border-radius:8px;border:1px solid ${currentTab==='analyse'?'#00e5a0':'#1e2736'};background:${currentTab==='analyse'?'#0f2a22':'#111827'};color:${currentTab==='analyse'?'#00e5a0':'#6b7280'};font-weight:${currentTab==='analyse'?700:400};font-size:13px;cursor:pointer">📊 Analyse</button>
        <button class="tab-btn" onclick="setTab('kennzahlen')" style="flex:1;padding:10px;border-radius:8px;border:1px solid ${currentTab==='kennzahlen'?'#00e5a0':'#1e2736'};background:${currentTab==='kennzahlen'?'#0f2a22':'#111827'};color:${currentTab==='kennzahlen'?'#00e5a0':'#6b7280'};font-weight:${currentTab==='kennzahlen'?700:400};font-size:13px;cursor:pointer">📋 Kennzahlen</button>
      </div>
      ${currentTab==='analyse' ? renderAnalyse(d, currentTicker) : renderKennzahlen(d)}
    ` : `
      <div style="text-align:center;padding:50px 20px">
        <div style="font-size:44px;margin-bottom:12px">📊</div>
        <div style="font-size:16px;color:#374151;font-weight:600">Unternehmen auswählen</div>
        <div style="font-size:13px;color:#6b7280;margin-top:6px">Ticker eingeben oder oben antippen</div>
      </div>
    `}
  `;
}

function selectTicker(t) {
  currentTicker = t;
  currentTab = 'analyse';
  render();
  window.scrollTo(0,0);
}

function doSearch() {
  const val = document.getElementById('searchInput').value.trim().toUpperCase();
  if (ALL_DATA[val]) { selectTicker(val); }
  else { alert(val + ' nicht gefunden.\nVerfügbar: ' + TICKERS.join(', ')); }
}

function setTab(t) {
  currentTab = t;
  render();
}

render();
</script>
</body>
</html>
